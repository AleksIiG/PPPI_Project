name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:

env:
  DOTNET_VERSION: "9.0.x"
  BUILD_CONFIG: Release

jobs:

  # =======================
  # 🧪 TEST
  # =======================
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # ✅ Cache NuGet
    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore "Project_PPPI.sln"

    - name: Run tests
      run: dotnet test "Project_PPPI.sln" --logger "trx" --results-directory TestResults || true

    # ✅ Artifact: test results (гарантовано знайде файл)
    - name: Upload Test Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        path: TestResults

  # =======================
  # 🏗 BUILD
  # =======================
  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore "Project_PPPI.sln"

    - name: Build
      run: dotnet build "Project_PPPI.sln" --configuration ${{ env.BUILD_CONFIG }}

    # ✅ ГАРАНТОВАНО створює папку publish
    - name: Publish
      run: |
        mkdir -p publish
        dotnet publish "Project_PPPI.sln" -c ${{ env.BUILD_CONFIG }} -o publish

    # ✅ Artifact: build (app-build)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: publish

  # =======================
  # 🚀 DEPLOY
  # =======================
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'

    environment:
      name: staging
      url: https://staging.example.com

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-build
        path: ./artifact

    - name: Simulate deploy
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        echo "Deploying with token: ${DEPLOY_TOKEN:0:4}****"
        ls -la ./artifact
        echo "✅ Deploy success"
