name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:

env:
  DOTNET_VERSION: "9.0.x"
  BUILD_CONFIG: Release

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Cache NuGet
    - uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore dependencies
      run: dotnet restore "Project_PPPI.sln"

    - name: Run tests
      run: dotnet test "Project_PPPI.sln" --logger "trx;LogFileName=test-results.trx" || true

    # Artifact: test report
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-report
        # точний шлях до .trx файлів
        path: Tests/TestResults

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - run: dotnet restore "Project_PPPI.sln"
    - run: dotnet build "Project_PPPI.sln" --configuration ${{ env.BUILD_CONFIG }}

    - run: dotnet publish "Project_PPPI.sln" -c ${{ env.BUILD_CONFIG }} -o ./publish

    # Artifact: build
    - uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    # Deploy з гілки develop
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: app-build
        path: ./artifact

    - name: Simulate deploy
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        echo "Deploying with token: ${DEPLOY_TOKEN:0:4}****"
        ls -la ./artifact
        echo " Deploy success"
