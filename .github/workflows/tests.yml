name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:

env:
  DOTNET_VERSION: "9.0.x"
  BUILD_CONFIG: Release

jobs:

# =======================
# 🧪 TEST
# =======================
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore "Project_PPPI.sln"

    # ✅ ГАРАНТОВАНО створюємо папку
    - name: Create TestResults folder
      run: mkdir -p TestResults

    # ✅ ЗАПУСК ТЕСТІВ СТРОГО ПО .csproj
    - name: Run Controller Tests
      run: dotnet test Tests/ControllersTests/ControllersTests.csproj --logger "trx;LogFileName=ControllersTests.trx" --results-directory TestResults || true

    - name: Run Service Tests
      run: dotnet test Tests/ServicesTests/ServicesTests.csproj --logger "trx;LogFileName=ServicesTests.trx" --results-directory TestResults || true

    # ✅ АРТЕФАКТ ТЕСТІВ ЗАВЖДИ ЗАВАНТАЖУЄТЬСЯ
    - name: Upload Test Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: TestResults


# =======================
# 🏗 BUILD
# =======================
  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore "Project_PPPI.sln"

    - name: Build
      run: dotnet build "Project_PPPI.sln" --configuration ${{ env.BUILD_CONFIG }}

    # ✅ ПРАВИЛЬНИЙ publish
    - name: Publish
      run: |
        mkdir -p publish
        dotnet publish "Project_PPPI.sln" -c ${{ env.BUILD_CONFIG }} -o publish

    # ✅ АРТЕФАКТ ЗБІРКИ
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: publish


# =======================
# 🚀 DEPLOY
# =======================
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/develop'

    environment:
      name: staging
      url: https://staging.example.com

    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-build
        path: ./artifact

    - name: Simulate deploy
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      run: |
        echo "Deploying with token: ${DEPLOY_TOKEN:0:4}****"
        ls -la ./artifact
        echo "✅ Deploy success"
